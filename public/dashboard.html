<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Gerencial - Mercadinho</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 32px;
      color: #1f2937;
    }

    .painel {
      max-width: 1100px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      color: #111827;
    }

    .btn {
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 10px;
      background: #e2e8f0;
      color: #0f172a;
      font-weight: 600;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(250px, 1fr));
      gap: 22px;
      margin-bottom: 28px;
    }

    .card {
      background: #eaf2ff;
      border-left: 6px solid #2563eb;
      border-radius: 12px;
      padding: 22px 18px;
      min-height: 130px;
    }

    .card:nth-child(2) {
      border-left-color: #10b981;
      background: #ecfdf5;
    }

    .label {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      margin-bottom: 12px;
    }

    .valor {
      font-size: 2.2rem;
      font-weight: 800;
      color: #111827;
    }

    .grafico-wrap {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
    }

    canvas {
      width: 100% !important;
      height: 340px !important;
    }
  </style>
</head>
<body>
  <div class="painel">
    <div class="topo">
      <h1>📊 Painel de Relatórios e Vendas</h1>
      <a class="btn" href="/caixa.html">Ir para o Caixa</a>
    </div>

    <div class="cards">
      <div class="card">
        <div class="label">Faturamento Total</div>
        <div id="faturamentoTotal" class="valor">R$ 0,00</div>
      </div>

      <div class="card">
        <div class="label">Total de Vendas</div>
        <div id="totalVendas" class="valor">0</div>
      </div>
    </div>

    <div class="grafico-wrap">
      <canvas id="graficoMaisVendidos"></canvas>
    </div>
  </div>

  <script>
    async function carregarRelatorio() {
      try {
        const resposta = await fetch('/api/relatorios');

        if (!resposta.ok) {
          const texto = await resposta.text();
          throw new Error(`HTTP ${resposta.status}: ${texto}`);
        }

        const dados = await resposta.json();

        const faturamento = Number(dados.faturamento_total ?? 0);
        const vendas = Number(dados.total_vendas ?? 0);
        const produtos = Array.isArray(dados.produtos_mais_vendidos)
          ? dados.produtos_mais_vendidos
          : [];

        document.getElementById('faturamentoTotal').textContent =
          `R$ ${faturamento.toFixed(2).replace('.', ',')}`;

        document.getElementById('totalVendas').textContent =
          vendas;

        const ctx = document.getElementById('graficoMaisVendidos').getContext('2d');

        if (window.graficoMaisVendidos) {
          window.graficoMaisVendidos.destroy();
        }

        window.graficoMaisVendidos = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: produtos.map(p => p.nome),
            datasets: [{
              label: 'Unidades Vendidas',
              data: produtos.map(p => Number(p.total_vendido ?? 0)),
              backgroundColor: ['#2563eb', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: true },
              title: {
                display: true,
                text: 'Produtos Mais Vendidos'
              }
            },
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });

      } catch (erro) {
        console.error('Erro ao carregar relatório:', erro);
        alert('Erro ao carregar relatório. Verifique se o backend está rodando.');
      }
    }

    carregarRelatorio();
  </script>
</body>
</html>
