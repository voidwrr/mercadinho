<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Gerencial - Mercadinho</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --page: #f1f4fb;
      --surface: #ffffff;
      --surface-raised: #f5f7fc;
      --line: #dce4ef;
      --text: #34445a;
      --muted: #6b7d95;
      --accent: #426bd6;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
      background: var(--page);
      margin: 0;
      padding: 32px 20px 56px;
      color: var(--text);
    }

    .painel {
      max-width: 1160px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 26px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .045);
    }

    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 17px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      font-size: 25px;
      color: var(--text);
    }

    .btn {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-raised);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      transition: border-color .16s, color .16s;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(250px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 20px 18px;
      min-height: 120px;
    }

    .card:nth-child(2) {
      border-left-color: #e59a3b;
      background: #fff8eb;
    }

    .label {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .valor {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text);
    }

    .grafico-wrap {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }

    canvas {
      width: 100% !important;
      height: 340px !important;
    }
    @media (max-width: 620px) {
      body { padding: 18px 12px 32px; }
      .painel { padding: 18px; }
      .topo { align-items: flex-start; flex-direction: column; }
      .cards { grid-template-columns: 1fr; }
      canvas { height: 300px !important; }
    }
  </style>
</head>
<body>
  <div class="painel">
    <div class="topo">
      <h1>📊 Painel de Relatórios e Vendas</h1>
      <a class="btn" href="/caixa.html">Ir para o Caixa</a>
    </div>

    <div class="cards">
      <div class="card">
        <div class="label">Faturamento Total</div>
        <div id="faturamentoTotal" class="valor">R$ 0,00</div>
      </div>

      <div class="card">
        <div class="label">Total de Vendas</div>
        <div id="totalVendas" class="valor">0</div>
      </div>
    </div>

    <div class="grafico-wrap">
      <canvas id="graficoMaisVendidos"></canvas>
      <div id="graficoFallback" style="display:none;"></div>
    </div>
  </div>

  <script>
    const coresProdutos = ['#426bd6', '#e59a3b', '#d85f68', '#8867b4', '#369bb8'];

    async function carregarRelatorio() {
      try {
        const resposta = await fetch('/api/relatorios');

        if (!resposta.ok) {
          const texto = await resposta.text();
          throw new Error(`HTTP ${resposta.status}: ${texto}`);
        }

        const dados = await resposta.json();

        const faturamento = Number(dados.faturamento_total ?? 0);
        const vendas = Number(dados.total_vendas ?? 0);
        const produtos = Array.isArray(dados.produtos_mais_vendidos)
          ? dados.produtos_mais_vendidos
          : [];

        document.getElementById('faturamentoTotal').textContent =
          `R$ ${faturamento.toFixed(2).replace('.', ',')}`;

        document.getElementById('totalVendas').textContent =
          vendas;

        const canvas = document.getElementById('graficoMaisVendidos');

        if (typeof Chart !== 'function') {
          canvas.style.display = 'none';
          const fallback = document.getElementById('graficoFallback');
          fallback.style.display = 'grid';
          fallback.style.gap = '12px';
          fallback.innerHTML = produtos.length
            ? produtos.map((produto, index) => `
                <div>
                  <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
                    <strong>${produto.nome}</strong><span>${produto.total_vendido} un.</span>
                  </div>
                  <div style="height:18px;background:#e7ecf5;border-radius:4px;overflow:hidden;">
                    <div style="height:100%;width:${Math.max(Number(produto.total_vendido) * 100, 4)}%;max-width:100%;background:${coresProdutos[index % coresProdutos.length]};"></div>
                  </div>
                </div>
              `).join('')
            : '<p>Nenhum produto vendido ainda.</p>';
          return;
        }

        const ctx = canvas.getContext('2d');

        if (window.graficoMaisVendidos && typeof window.graficoMaisVendidos.destroy === 'function') {
          window.graficoMaisVendidos.destroy();
        }

        window.graficoMaisVendidos = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: produtos.map(p => p.nome),
            datasets: [{
              label: 'Unidades Vendidas',
              data: produtos.map(p => Number(p.total_vendido ?? 0)),
              backgroundColor: produtos.map((produto, index) => coresProdutos[index % coresProdutos.length]),
              borderRadius: 5
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: true, labels: { color: '#6b7279' } },
              title: {
                display: true,
                text: 'Produtos Mais Vendidos',
                color: '#25292d'
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: { color: '#6b7279' },
                grid: { color: '#e5e7e9' }
              }
            }
          }
        });

      } catch (erro) {
        console.error('Erro ao carregar relatório:', erro);
        alert(`Erro ao carregar relatório: ${erro.message}`);
      }
    }

    carregarRelatorio();
  </script>
</body>
</html>
