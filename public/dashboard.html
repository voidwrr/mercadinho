<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Gerencial - Mercadinho</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-body: #f4f7f6;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-body);
      margin: 0;
      padding: 30px 20px;
      color: var(--text-main);
    }

    .painel {
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    /* Cabeçalho e Navegação */
    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f0f2f5;
      padding-bottom: 20px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 15px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      color: #2c3e50;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .navegacao {
      display: flex;
      gap: 10px;
    }

    .btn-nav {
      text-decoration: none;
      padding: 9px 16px;
      border-radius: 8px;
      background: #e2e8f0;
      color: #475569;
      font-weight: bold;
      font-size: 14px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-nav:hover {
      background: #cbd5e1;
      color: #0f172a;
    }

    .btn-nav.ativo {
      background: var(--primary);
      color: #ffffff;
    }

    /* Grid de Cards KPIs */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card-kpi {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card-kpi:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.05);
    }

    .card-kpi::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: var(--primary);
    }

    .card-kpi.faturamento::before { background: var(--success); }
    .card-kpi.vendas::before { background: var(--primary); }
    .card-kpi.ticket::before { background: var(--warning); }

    .card-label {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .card-valor {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
    }

    /* Área do Gráfico */
    .grafico-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 24px;
    }

    .grafico-cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .grafico-titulo {
      font-size: 18px;
      font-weight: 700;
      color: #334155;
      margin: 0;
    }

    .filtro-periodo {
      padding: 6px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 350px;
    }

    /* Fallback sem Chart.js */
    .fallback-barras {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 10px;
    }

    .bar-item-info {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .bar-track {
      height: 16px;
      background: #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 8px;
      transition: width 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="painel">
    <!-- Cabeçalho -->
    <div class="topo">
      <h1>📈 Painel de Desempenho</h1>
      <nav class="navegacao">
        <a class="btn-nav" href="/caixa.html">🛒 Caixa</a>
        <a class="btn-nav" href="/estoque.html">📦 Estoque</a>
        <a class="btn-nav ativo" href="/dashboard.html">📊 Dashboard</a>
      </nav>
    </div>

    <!-- Indicadores Principais (KPIs) -->
    <div class="cards-grid">
      <div class="card-kpi faturamento">
        <div class="card-label">Faturamento Total</div>
        <div id="faturamentoTotal" class="card-valor">R$ 0,00</div>
      </div>

      <div class="card-kpi vendas">
        <div class="card-label">Total de Vendas</div>
        <div id="totalVendas" class="card-valor">0</div>
      </div>

      <div class="card-kpi ticket">
        <div class="card-label">Ticket Médio</div>
        <div id="ticketMedio" class="card-valor">R$ 0,00</div>
      </div>
    </div>

    <!-- Seção do Gráfico -->
    <div class="grafico-card">
      <div class="grafico-cabecalho">
        <h2 class="grafico-titulo">🏆 Produtos Mais Vendidos</h2>
        <select id="filtroPeriodo" class="filtro-periodo" onchange="carregarRelatorio()">
          <option value="todos">Todo o Período</option>
          <option value="hoje">Hoje</option>
          <option value="7dias">Últimos 7 dias</option>
          <option value="30dias">Últimos 30 dias</option>
        </select>
      </div>

      <div class="canvas-container">
        <canvas id="graficoMaisVendidos"></canvas>
        <div id="graficoFallback" style="display:none;" class="fallback-barras"></div>
      </div>
    </div>
  </div>

  <script>
    async function carregarRelatorio() {
      const periodo = document.getElementById('filtroPeriodo').value;

      try {
        const resposta = await fetch(`/api/relatorios?periodo=${periodo}`);

        if (!resposta.ok) {
          const texto = await resposta.text();
          throw new Error(`HTTP ${resposta.status}: ${texto}`);
        }

        const dados = await resposta.json();

        const faturamento = Number(dados.faturamento_total ?? 0);
        const vendas = Number(dados.total_vendas ?? 0);
        const ticketMedio = vendas > 0 ? (faturamento / vendas) : 0;

        const produtos = Array.isArray(dados.produtos_mais_vendidos)
          ? dados.produtos_mais_vendidos
          : [];

        // Atualização dos Cards
        document.getElementById('faturamentoTotal').textContent =
          `R$ ${faturamento.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        document.getElementById('totalVendas').textContent = vendas;

        document.getElementById('ticketMedio').textContent =
          `R$ ${ticketMedio.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

        const canvas = document.getElementById('graficoMaisVendidos');
        const fallback = document.getElementById('graficoFallback');

        // Validação da biblioteca Chart.js
        if (typeof Chart !== 'function') {
          renderizarFallback(canvas, fallback, produtos);
          return;
        }

        canvas.style.display = 'block';
        fallback.style.display = 'none';

        renderizarGraficoChartJS(canvas, produtos);

      } catch (erro) {
        console.error('Erro ao carregar relatório:', erro);
      }
    }

    function renderizarGraficoChartJS(canvas, produtos) {
      const ctx = canvas.getContext('2d');

      if (window.instanciaGrafico && typeof window.instanciaGrafico.destroy === 'function') {
        window.instanciaGrafico.destroy();
      }

      const labels = produtos.map(p => p.nome || 'Sem nome');
      const valores = produtos.map(p => Number(p.total_vendido ?? 0));

      window.instanciaGrafico = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Qtd. Vendida',
            data: valores,
            backgroundColor: [
              '#2563eb', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'
            ],
            borderRadius: 6,
            borderSkipped: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (context) => ` Vendidos: ${context.raw} un.`
              }
            }
          },
          scales: {
            x: {
              grid: { display: false }
            },
            y: {
              beginAtZero: true,
              ticks: { precision: 0 },
              grid: { color: '#f1f5f9' }
            }
          }
        }
      });
    }

    function renderizarFallback(canvas, fallback, produtos) {
      canvas.style.display = 'none';
      fallback.style.display = 'flex';

      if (!produtos.length) {
        fallback.innerHTML = '<p style="text-align:center; color:#94a3b8;">Nenhum produto vendido no período selecionado.</p>';
        return;
      }

      const maiorQtd = Math.max(...produtos.map(p => Number(p.total_vendido ?? 0)), 1);

      fallback.innerHTML = produtos.map(p => {
        const qtd = Number(p.total_vendido ?? 0);
        const pct = Math.max((qtd / maiorQtd) * 100, 5);

        return `
          <div>
            <div class="bar-item-info">
              <span>${p.nome}</span>
              <span><strong>${qtd}</strong> un.</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width: ${pct}%;"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Inicialização
    carregarRelatorio();
  </script>
</body>
</html>
