<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa - Mercadinho</title>
    <style>
        :root {
            --page: #f1f4fb;
            --surface: #ffffff;
            --surface-raised: #f5f7fc;
            --line: #dce4ef;
            --text: #34445a;
            --muted: #6b7d95;
            --accent: #426bd6;
            --accent-hover: #3158bd;
            --summary-line: #d7e2fa;
            --soft-blue: #eef3ff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 32px 20px 56px;
            background: var(--page);
            color: var(--text);
            font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
        }
        .container {
            max-width: 1160px;
            margin: auto;
            display: grid;
            grid-template-columns: minmax(0, 1.7fr) minmax(280px, .85fr);
            gap: 20px;
            align-items: stretch;
        }
        .painel, .painel-escuro {
            min-width: 0;
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: var(--surface);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .045);
        }
        .painel { border-top: 3px solid var(--accent); }
        .painel-escuro {
            display: flex;
            flex-direction: column;
            background: var(--soft-blue);
            border-color: var(--summary-line);
            border-top: 3px solid var(--accent);
        }
        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--line);
            padding-bottom: 16px;
            margin-bottom: 22px;
        }
        h1 { margin: 0; color: var(--text); font-size: 25px; }
        h2 { margin: 0 0 18px; border-bottom: 1px solid var(--line); padding-bottom: 15px; font-size: 19px; }
        .btn-navegacao {
            display: inline-flex;
            align-items: center;
            min-height: 38px;
            text-decoration: none;
            background: var(--surface-raised);
            border: 1px solid var(--line);
            color: var(--text);
            padding: 0 12px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: bold;
            transition: .2s;
        }
        .btn-navegacao:hover { border-color: var(--accent); color: var(--accent); }
        .links-navegacao { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        .controles { display: flex; gap: 10px; margin-bottom: 20px; }
        select, input {
            min-width: 0;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 14px;
            outline: none;
            transition: .2s;
        }
        select { flex: 2; }
        input[type="number"] { flex: 1; }
        select:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(66, 107, 214, .14); }
        button { border: none; border-radius: 6px; font: inherit; font-weight: bold; cursor: pointer; transition: .2s; padding: 12px 18px; }
        .btn-azul { background: var(--accent); color: white; }
        .btn-azul:hover { background: var(--accent-hover); }
        .btn-verde { width: 100%; font-size: 15px; padding: 14px; margin-top: auto; background: var(--accent); color: white; }
        .btn-verde:hover { background: var(--accent-hover); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--line); }
        th { background: var(--surface-raised); color: var(--muted); font-size: 11px; letter-spacing: .5px; text-transform: uppercase; }
        td { font-size: 14px; }
        tbody tr:nth-child(even) { background: var(--surface-raised); }
        tbody tr:hover { background: var(--soft-blue); }
        .total-destaque { font-size: 34px; color: var(--accent); font-weight: bold; text-align: right; margin: 18px 0 24px; }
        .forma-pagamento { width: 100%; margin-bottom: 20px; }
        .opcao-comprovante { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 13px; color: var(--muted); }
        .opcao-comprovante input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
        .telefone-comprovante { margin-bottom: 20px; }
        .telefone-comprovante input { width: 100%; }
        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; }
            .painel-escuro { min-height: 440px; }
        }
        @media (max-width: 560px) {
            body { padding: 18px 12px 32px; }
            .painel, .painel-escuro { padding: 17px; }
            .cabecalho { align-items: flex-start; flex-direction: column; }
            .links-navegacao { justify-content: flex-start; }
            .controles { display: grid; grid-template-columns: minmax(0, 1fr) 86px; }
            .controles select { grid-column: 1 / -1; }
            .controles button { grid-column: 1 / -1; }
            table { min-width: 470px; }
            .painel { overflow-x: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Lado Esquerdo: Frente de Caixa -->
        <div class="painel">
            <div class="cabecalho">
                <h1>🛒 Frente de Caixa</h1>
                <nav class="links-navegacao">
                    <a href="/dashboard.html" class="btn-navegacao">📊 Dashboard</a>
                    <a href="/estoque.html" class="btn-navegacao">📦 Gestão de Estoque</a>
                </nav>
            </div>

            <div class="controles">
                <select id="produtoSelect">
                    <option value="">Selecione um produto...</option>
                    <!-- Produtos via JS -->
                </select>
                <input type="number" id="quantidade" value="1" min="1">
                <button class="btn-azul" onclick="adicionarAoCarrinho()">Adicionar</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço Un.</th>
                        <th>Qtd</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="listaCarrinho">
                    <!-- Itens adicionados aparecem aqui -->
                </tbody>
            </table>
        </div>

        <!-- Lado Direito: Resumo da Venda -->
        <div class="painel-escuro">
            <h2>Resumo da Venda</h2>
            <p>Itens no carrinho: <span id="qtdItens">0</span></p>
            
            <div class="total-destaque">
                R$ <span id="valorTotal">0,00</span>
            </div>

            <label>Forma de Pagamento:</label>
            <select id="formaPagamento" class="forma-pagamento">
                <option value="pix">PIX</option>
                <option value="dinheiro">Dinheiro</option>
                <option value="cartao_credito">Cartão de Crédito</option>
                <option value="cartao_debito">Cartão de Débito</option>
            </select>

            <label class="opcao-comprovante">
                <input type="checkbox" id="enviarComprovante">
                Cliente deseja receber o comprovante pelo WhatsApp
            </label>
            <div id="campoTelefoneComprovante" class="telefone-comprovante" hidden>
                <label for="telefoneComprovante">Telefone com DDD:</label>
                <input type="tel" id="telefoneComprovante" autocomplete="tel" placeholder="(11) 99999-9999">
            </div>

            <button class="btn-verde" onclick="finalizarVenda()">Finalizar Venda</button>
        </div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
