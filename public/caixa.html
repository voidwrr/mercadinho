<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Caixa - Mercadinho</title>
    <style>
        /* CSS Moderno seguindo o padrão do Estoque */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 40px 20px; 
            color: #333;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .painel { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
        }
        .painel-escuro {
            background: #2c3e50;
            color: white;
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            display: flex;
            flex-direction: column;
        }
        .cabecalho {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #f0f2f5; padding-bottom: 15px; margin-bottom: 25px;
        }
        h1 { margin: 0; color: #2c3e50; font-size: 24px; }
        h2 { margin-top: 0; border-bottom: 1px solid #475b6d; padding-bottom: 15px; font-size: 20px; }
        
        .btn-navegacao { 
            text-decoration: none; background: #e2e8f0; color: #4a5568; 
            padding: 8px 16px; border-radius: 8px; font-weight: bold; transition: 0.2s;
        }
        .btn-navegacao:hover { background: #cbd5e1; }

        /* Controles do Caixa */
        .controles { display: flex; gap: 10px; margin-bottom: 20px; }
        select, input { 
            padding: 12px; border: 1px solid #cbd5e1; 
            border-radius: 8px; font-size: 15px; outline: none; transition: 0.2s;
        }
        select { flex: 2; }
        input[type="number"] { flex: 1; }
        select:focus, input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        button { border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; padding: 12px 24px; }
        .btn-azul { background: #3b82f6; color: white; }
        .btn-azul:hover { background: #2563eb; }
        .btn-verde { background: #10b981; color: white; width: 100%; font-size: 16px; padding: 15px; margin-top: auto; }
        .btn-verde:hover { background: #059669; }

        /* Tabela */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f0f2f5; }
        th { color: #64748b; font-size: 13px; text-transform: uppercase; }
        
        /* Resumo Lateral */
        .total-destaque { font-size: 36px; color: #10b981; font-weight: bold; text-align: right; margin: 20px 0; }
        .forma-pagamento { width: 100%; margin-bottom: 20px; background: white; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Lado Esquerdo: Frente de Caixa -->
        <div class="painel">
            <div class="cabecalho">
                <h1>🛒 Frente de Caixa</h1>
                <a href="/estoque.html" class="btn-navegacao">📦 Gestão de Estoque</a>
            </div>

            <div class="controles">
                <select id="produtoSelect">
                    <option value="">Selecione um produto...</option>
                    <!-- Produtos via JS -->
                </select>
                <input type="number" id="quantidade" value="1" min="1">
                <button class="btn-azul" onclick="adicionarAoCarrinho()">Adicionar</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Produto</th>
                        <th>Preço Un.</th>
                        <th>Qtd</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="listaCarrinho">
                    <!-- Itens adicionados aparecem aqui -->
                </tbody>
            </table>
        </div>

        <!-- Lado Direito: Resumo da Venda -->
        <div class="painel-escuro">
            <h2>Resumo da Venda</h2>
            <p>Itens no carrinho: <span id="qtdItens">0</span></p>
            
            <div class="total-destaque">
                R$ <span id="valorTotal">0,00</span>
            </div>

            <label>Forma de Pagamento:</label>
            <select id="formaPagamento" class="forma-pagamento">
                <option value="PIX">PIX</option>
                <option value="DINHEIRO">Dinheiro</option>
                <option value="CARTAO_CREDITO">Cartão de Crédito</option>
                <option value="CARTAO_DEBITO">Cartão de Débito</option>
            </select>

            <button class="btn-verde" onclick="finalizarVenda()">Finalizar Venda</button>
        </div>
    </div>

    <!-- Puxamos o seu script.js original para manter a lógica funcionando -->
    <script src="script.js"></script>
</body>
</html>
